[project]
name = "pixeltable-equipment-manual-chat"
version = "0.1.0"
description = "Chat-with-your-PDFs API for equipment manuals: upload PDF or Markdown manuals, page-aware chunking, an embedding index, and cited gpt-4o-mini answers from one FastAPIRouter - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "fastapi", "computed-columns", "data-infrastructure", "equipment-manual-chat"]
dependencies = [
    "pixeltable[serve]>=0.7.21",
    "httpx",
    "pymupdf",
    "openai>=1",
    "mistune>=3",
    "tiktoken",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
